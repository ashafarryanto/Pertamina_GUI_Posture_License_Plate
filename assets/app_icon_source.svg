<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d90a1a"/>
      <stop offset="1" stop-color="#0a2a4a"/>
    </linearGradient>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="256" height="256" rx="56" ry="56"/>
    </clipPath>
  </defs>

  <!-- background badge -->
  <g clip-path="url(#roundedClip)">
    <rect x="0" y="0" width="256" height="256" fill="url(#bgGrad)"/>
    <!-- green diagonal accent, ciri khas 3 warna Pertamina -->
    <polygon points="256,256 256,168 168,256" fill="#0f9d4a"/>
    <polygon points="256,256 256,205 205,256" fill="#0c7a3a"/>
    <!-- highlight diagonal stripe kiri atas -->
    <polygon points="0,0 96,0 0,96" fill="#ffffff" opacity="0.08"/>
  </g>
  <rect x="1" y="1" width="254" height="254" rx="55" ry="55" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- lingkaran putih tempat pictogram -->
  <circle cx="128" cy="126" r="96" fill="#ffffff"/>

  <!-- pictogram orang (deteksi postur) -->
  <circle cx="103" cy="96" r="21" fill="#0a2a4a"/>
  <path d="M103,118
           C132,118 150,140 150,172
           L56,172
           C56,140 74,118 103,118 Z" fill="#0a2a4a"/>

  <!-- pictogram plat nomor (ANPR), tumpang tindih dikit di kanan-bawah -->
  <rect x="128" y="148" width="70" height="42" rx="9" fill="#ffffff" stroke="#d90a1a" stroke-width="7"/>
  <rect x="139" y="162" width="48" height="7" rx="3.5" fill="#d90a1a"/>
  <rect x="139" y="175" width="32" height="7" rx="3.5" fill="#d90a1a"/>
</svg>
